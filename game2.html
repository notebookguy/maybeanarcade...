<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#0c0720"/> />
		<title>Tag Arena</title>
		<style>
			:root {
				color-scheme: dark;
			--ink: #eafcff;
			--deep: #181033;
			--muted: #9d92c9;
			--paper: #0c0720;
			--line: #33265e;
			--blue: #35d6ff;
			--red: #ff5d73;
			--gold: #ffd23f;
			--neon: #b96bff;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-width: 320px;
				min-height: 100vh;
				margin: 0;
				padding: 22px 16px 26px;
				color: var(--ink);
			background-color: var(--paper);
			background-image: linear-gradient(rgba(53, 214, 255, 0.05) 1px, transparent 1px),
				linear-gradient(90deg, rgba(185, 107, 255, 0.05) 1px, transparent 1px);
			background-size: 24px 24px;
			font-family: "Courier New", monospace;
			}

			.game {
				width: min(1080px, 100%);
				margin: 0 auto;
				animation: arrive 420ms ease-out both;
			}

			.masthead {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 16px;
				margin-bottom: 14px;
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 12px;
			}

			.brand-mark {
				position: relative;
				width: 38px;
				height: 30px;
			}

			.brand-mark::before,
			.brand-mark::after {
				position: absolute;
				top: 3px;
				width: 24px;
				height: 24px;
				border: 3px solid var(--ink);
				border-radius: 50%;
				content: "";
			}

			.brand-mark::before {
				left: 0;
				background: var(--blue);
			}

			.brand-mark::after {
				right: 0;
				background: var(--red);
			}

			h1 {
			margin: 0;
			font-family: "Courier New", monospace;
			font-size: 26px;
			line-height: 1;
			text-transform: uppercase;
			letter-spacing: 2px;
			text-shadow: 0 0 12px rgba(53, 214, 255, 0.7);
			}

			.round-label {
				margin-top: 5px;
				color: var(--muted);
				font-size: 11px;
				font-weight: 800;
				letter-spacing: 1.4px;
				text-transform: uppercase;
			}

			button,
			.menu-btn {
				min-height: 42px;
				padding: 0 16px;
				border: 2px solid var(--ink);
				border-radius: 4px;
				color: var(--ink);
				background: var(--gold);
				box-shadow: 3px 3px 0 var(--ink);
				font: inherit;
				font-size: 13px;
				font-weight: 900;
				letter-spacing: 0.5px;
				text-transform: uppercase;
				cursor: pointer;
				transition: transform 120ms ease, box-shadow 120ms ease;
			}

			.menu-btn {
				text-decoration: none;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				background: var(--neon);
				color: #150b2e;
			}

			button:hover,
			.menu-btn:hover {
				transform: translate(1px, 1px);
				box-shadow: 2px 2px 0 var(--ink);
			}

			button:active,
			.menu-btn:active {
				transform: translate(3px, 3px);
				box-shadow: none;
			}

			button:focus-visible,
			.menu-btn:focus-visible {
				outline: 3px solid var(--blue);
				outline-offset: 4px;
			}

			.masthead-actions {
				display: flex;
				gap: 10px;
			}

			.scoreboard {
				display: grid;
				grid-template-columns: 1fr 1fr 0.8fr 1fr 1fr;
				align-items: stretch;
				overflow: hidden;
				margin-bottom: 12px;
				border: 2px solid var(--ink);
				border-radius: 5px;
				color: #f3f4e9;
				background: var(--deep);
				box-shadow: 4px 4px 0 rgba(23, 36, 31, 0.2);
			}

			.score-slot {
				display: flex;
				min-width: 0;
				min-height: 70px;
				flex-direction: column;
				justify-content: center;
				gap: 5px;
				padding: 10px 16px;
				border-right: 1px solid rgba(239, 242, 223, 0.18);
			}

			.score-slot:last-child {
				border-right: 0;
			}

			.slot-label {
				color: #afc0b2;
				font-size: 10px;
				font-weight: 900;
				letter-spacing: 1.5px;
				text-transform: uppercase;
			}

			.slot-value {
				overflow: hidden;
				font-family: "Courier New", monospace;
				font-size: 19px;
				font-weight: 700;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.player-slot {
				flex-direction: row;
				align-items: center;
				justify-content: flex-start;
				gap: 11px;
			}

			.player-dot {
				width: 15px;
				height: 15px;
				flex: 0 0 15px;
				border: 2px solid #f4f2e8;
				border-radius: 50%;
			}

			.player-dot.blue {
				background: var(--blue);
			}

			.player-dot.red {
				background: var(--red);
			}

			.player-copy {
				min-width: 0;
			}

			.player-state {
				display: block;
				min-height: 14px;
				color: #bac9bd;
				font-size: 10px;
				font-weight: 900;
				letter-spacing: 1px;
			}

			.player-state.is-it {
				color: var(--gold);
			}

			.timer-slot {
				align-items: center;
				background: rgba(0, 0, 0, 0.16);
				text-align: center;
			}

			.timer-value {
				font-family: "Courier New", monospace;
				font-size: 27px;
				font-variant-numeric: tabular-nums;
				line-height: 1;
			}

			.arena {
				overflow: hidden;
				border: 3px solid var(--ink);
				border-radius: 5px;
				background: #0a0618;
				box-shadow: 6px 6px 0 var(--ink);
			}

			canvas {
				display: block;
				width: 100%;
				height: auto;
				aspect-ratio: 1000 / 620;
				touch-action: none;
			}

			canvas:focus-visible {
				outline: 4px solid var(--gold);
				outline-offset: -8px;
			}

			.control-strip {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 18px;
				padding: 16px 4px 0;
			}

			.controls {
				display: flex;
				flex-wrap: wrap;
				gap: 22px;
			}

			.control-set {
				display: flex;
				align-items: center;
				gap: 9px;
				color: var(--muted);
				font-size: 12px;
				font-weight: 900;
				text-transform: uppercase;
			}

			.keyset {
				display: inline-flex;
				gap: 3px;
			}

			kbd {
				display: inline-grid;
				min-width: 23px;
				height: 23px;
				place-items: center;
				padding: 0 5px;
				border: 1px solid #9aa99c;
				border-radius: 3px;
				color: var(--ink);
				background: #f7f8f1;
				box-shadow: 0 2px 0 #aab6a9;
				font: 800 11px "Trebuchet MS", "Segoe UI", sans-serif;
			}

			.blue-label {
				color: #1472ce;
			}

			.red-label {
				color: #c94a40;
			}

			.tag-hint {
				color: var(--muted);
				font-size: 12px;
				font-weight: 700;
				text-align: right;
			}

			@keyframes arrive {
				from { opacity: 0; transform: translateY(8px); }
				to { opacity: 1; transform: translateY(0); }
			}

			@media (max-width: 700px) {
				body {
					padding: 14px 10px 20px;
				}

				.scoreboard {
					grid-template-columns: 1fr 1fr 0.9fr;
				}

				.score-slot {
					min-height: 62px;
					padding: 8px 10px;
				}

				.score-slot:nth-child(2) {
					border-right: 0;
				}

				.score-slot:nth-child(3) {
					grid-column: 1 / -1;
					grid-row: 2;
					min-height: 58px;
					border-top: 1px solid rgba(239, 242, 223, 0.18);
					border-right: 0;
				}

				.score-slot:nth-child(4) {
					grid-column: 1;
					grid-row: 3;
					border-top: 1px solid rgba(239, 242, 223, 0.18);
				}

				.score-slot:nth-child(5) {
					grid-column: 2;
					grid-row: 3;
					border-top: 1px solid rgba(239, 242, 223, 0.18);
					border-right: 0;
				}

				.control-strip {
					align-items: flex-start;
					flex-direction: column;
					gap: 12px;
				}

				.tag-hint {
					text-align: left;
				}
			}

			@media (max-width: 420px) {
				h1 {
					font-size: 22px;
				}

				.round-label {
					font-size: 9px;
				}

				.controls {
					gap: 12px;
				}

				.control-set {
					gap: 6px;
					font-size: 10px;
				}

				.score-slot {
					padding: 7px;
				}

				.slot-value {
					font-size: 16px;
				}

				.timer-value {
					font-size: 25px;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*, *::before, *::after {
					animation-duration: 0.01ms !important;
					transition-duration: 0.01ms !important;
				}
			}
		</style>
	</head>
	<body>
		<main class="game">
			<header class="masthead">
				<div class="brand">
					<span class="brand-mark" aria-hidden="true"></span>
					<div>
						<h1>Tag Arena</h1>
						<div class="round-label">Local two-player match</div>
					</div>
				</div>
				<div class="masthead-actions">
					<button id="restartButton" type="button" aria-label="Start a new round">New round</button>
					<a class="menu-btn" href="index.html">Menu</a>
				</div>
			</header>

			<section class="scoreboard" aria-label="Match scoreboard" aria-live="polite">
				<div class="score-slot player-slot">
					<span class="player-dot blue" aria-hidden="true"></span>
					<div class="player-copy">
						<span class="slot-label">Blue</span>
						<span id="blueState" class="player-state">SAFE</span>
					</div>
				</div>
				<div class="score-slot player-slot">
					<span class="player-dot red" aria-hidden="true"></span>
					<div class="player-copy">
						<span class="slot-label">Red</span>
						<span id="redState" class="player-state">SAFE</span>
					</div>
				</div>
				<div class="score-slot timer-slot">
					<span class="slot-label">Time left</span>
					<span id="timer" class="timer-value">2:00</span>
				</div>
				<div class="score-slot">
					<span class="slot-label">Blue tagged</span>
					<span id="blueTags" class="slot-value">0</span>
				</div>
				<div class="score-slot">
					<span class="slot-label">Red tagged</span>
					<span id="redTags" class="slot-value">0</span>
				</div>
			</section>

			<section class="arena" aria-label="Tag Arena playfield">
				<canvas id="arena" width="1000" height="620" tabindex="0" aria-label="Platform tag game. Blue uses WASD, Red uses the arrow keys."></canvas>
			</section>

			<footer class="control-strip">
				<div class="controls" aria-label="Player controls">
					<div class="control-set blue-label">
						<span>Blue</span>
						<span class="keyset" aria-label="W A S D">
							<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
						</span>
					</div>
					<div class="control-set red-label">
						<span>Red</span>
						<span class="keyset" aria-label="Arrow keys">
							<kbd>&uarr;</kbd><kbd>&larr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd>
						</span>
					</div>
				</div>
				<div id="roundMessage" class="tag-hint">Pass the tag before the clock runs out.</div>
			</footer>
		</main>

		<script>
			const canvas = document.getElementById('arena');
			const ctx = canvas.getContext('2d');
			const timerEl = document.getElementById('timer');
			const blueStateEl = document.getElementById('blueState');
			const redStateEl = document.getElementById('redState');
			const blueTagsEl = document.getElementById('blueTags');
			const redTagsEl = document.getElementById('redTags');
			const roundMessageEl = document.getElementById('roundMessage');
			const restartButton = document.getElementById('restartButton');

			const WIDTH = canvas.width;
			const HEIGHT = canvas.height;
			const ROUND_SECONDS = 120;
			const GRAVITY = 1450;
			const JUMP_SPEED = 640;
			const platforms = [
				{ x: 0, y: 570, w: WIDTH, h: 50, kind: 'floor' },
				{ x: 55, y: 495, w: 120, h: 16 },
				{ x: 225, y: 505, w: 120, h: 16, dy: -45 },
				{ x: 395, y: 470, w: 110, h: 16 },
				{ x: 555, y: 455, w: 120, h: 16, dy: 50 },
				{ x: 725, y: 495, w: 105, h: 16 },
				{ x: 870, y: 475, w: 95, h: 16 },
				{ x: 95, y: 410, w: 115, h: 16, dy: -50 },
				{ x: 265, y: 370, w: 105, h: 16 },
				{ x: 425, y: 350, w: 100, h: 16 },
				{ x: 585, y: 375, w: 110, h: 16, dy: 45 },
				{ x: 760, y: 400, w: 120, h: 16, dy: -55 },
				{ x: 170, y: 295, w: 100, h: 16 },
				{ x: 340, y: 265, w: 105, h: 16 },
				{ x: 530, y: 255, w: 100, h: 16 },
				{ x: 700, y: 295, w: 105, h: 16, dy: -40 },
			];
			const keys = new Set();
			let players;
			let round;
			let lastFrame = 0;
			let tagFlash = 0;
			let displayedSecond = -1;

			function makePlayer(color, x, controls) {
				return {
					color,
					x,
					y: 534,
					w: 28,
					h: 36,
					vx: 0,
					vy: 0,
					speed: 255,
					onGround: true,
					jumpQueued: false,
					controls,
					tags: 0,
				};
			}

			function startRound() {
				keys.clear();
				players = {
					blue: makePlayer('#3695f4', 120, { left: 'a', right: 'd', jump: 'w', down: 's' }),
					red: makePlayer('#ef6258', 852, { left: 'arrowleft', right: 'arrowright', jump: 'arrowup', down: 'arrowdown' }),
				};
				round = {
					timeLeft: ROUND_SECONDS,
					it: Math.random() < 0.5 ? 'blue' : 'red',
					contactLocked: false,
					finished: false,
					winner: null,
				};
				tagFlash = 0;
				roundMessageEl.textContent = 'Pass the tag before the clock runs out.';
				updateHud();
			}

			function updateHud() {
				const seconds = Math.max(0, Math.ceil(round.timeLeft));
				const minutes = Math.floor(seconds / 60);
				const remainder = String(seconds % 60).padStart(2, '0');
				displayedSecond = seconds;
				timerEl.textContent = `${minutes}:${remainder}`;
				blueTagsEl.textContent = String(players.blue.tags);
				redTagsEl.textContent = String(players.red.tags);
				blueStateEl.textContent = round.it === 'blue' ? 'IT' : 'SAFE';
				redStateEl.textContent = round.it === 'red' ? 'IT' : 'SAFE';
				blueStateEl.classList.toggle('is-it', round.it === 'blue');
				redStateEl.classList.toggle('is-it', round.it === 'red');

				if (round.finished) {
					const winnerName = round.winner === 'blue' ? 'Blue' : 'Red';
					roundMessageEl.textContent = `${winnerName} outlasted the tag.`;
				}
			}

			function movePlayer(player, dt) {
				const left = keys.has(player.controls.left);
				const right = keys.has(player.controls.right);
				const dropping = keys.has(player.controls.down);
				const direction = Number(right) - Number(left);

				player.vx = direction * player.speed;
				player.x = Math.max(0, Math.min(WIDTH - player.w, player.x + player.vx * dt));

				if (player.jumpQueued && player.onGround && !round.finished) {
					player.vy = -JUMP_SPEED;
					player.onGround = false;
					player.jumpQueued = false;
				}

				const previousBottom = player.y + player.h;
				player.vy += GRAVITY * dt;
				player.y += player.vy * dt;
				player.onGround = false;

				for (const platform of platforms) {
					if (dropping && platform.kind !== 'floor') continue;

					const horizontalOverlap = player.x < platform.x + platform.w &&
						player.x + player.w > platform.x;
					if (!horizontalOverlap) continue;

					let surfaceY = platform.y;
					let crossedTop = player.vy >= 0 &&
						previousBottom <= platform.y &&
						player.y + player.h >= platform.y;

					if (platform.dy) {
						const centerX = player.x + player.w / 2;
						const previousCenterX = centerX - player.vx * dt;
						const t = Math.max(0, Math.min(1, (centerX - platform.x) / platform.w));
						const previousT = Math.max(0, Math.min(1, (previousCenterX - platform.x) / platform.w));
						surfaceY = platform.y + platform.dy * t;
						const previousSurfaceY = platform.y + platform.dy * previousT;
						crossedTop = player.y + player.h >= surfaceY &&
							previousBottom <= previousSurfaceY + 8;
					}

					if (crossedTop) {
						player.y = surfaceY - player.h;
						player.vy = 0;
						player.onGround = true;
					}
				}
			}

			function checkTag() {
				const blue = players.blue;
				const red = players.red;
				const touching = blue.x < red.x + red.w &&
					blue.x + blue.w > red.x &&
					blue.y < red.y + red.h &&
					blue.y + blue.h > red.y;

				if (!touching) {
					round.contactLocked = false;
					return;
				}

				if (round.contactLocked) return;

				round.it = round.it === 'blue' ? 'red' : 'blue';
				players[round.it].tags += 1;
				round.contactLocked = true;
				tagFlash = 0.22;
				updateHud();
			}

			function update(dt) {
				if (round.finished) return;

				round.timeLeft = Math.max(0, round.timeLeft - dt);
				movePlayer(players.blue, dt);
				movePlayer(players.red, dt);
				checkTag();
				tagFlash = Math.max(0, tagFlash - dt);

				if (Math.ceil(round.timeLeft) !== displayedSecond) {
					updateHud();
				}

				if (round.timeLeft === 0) {
					round.finished = true;
					round.winner = round.it === 'blue' ? 'red' : 'blue';
					updateHud();
				}
			}

			function drawBackdrop() {
				const background = ctx.createLinearGradient(0, 0, 0, HEIGHT);
				background.addColorStop(0, '#1d1140');
				background.addColorStop(1, '#0a0618');
				ctx.fillStyle = background;
				ctx.fillRect(0, 0, WIDTH, HEIGHT);

				ctx.fillStyle = 'rgba(185, 107, 255, 0.55)';
				for (let i = 0; i < 60; i++) {
					if (Math.sin(performance.now() / 500 + i) > 0.4) {
						ctx.fillRect((i * 137) % WIDTH, (i * 89) % 470, 3, 3);
					}
				}
				ctx.fillStyle = 'rgba(53, 214, 255, 0.5)';
				for (let i = 0; i < 40; i++) {
					ctx.fillRect((i * 211 + 40) % WIDTH, (i * 149 + 20) % 420, 2, 2);
				}

				ctx.fillStyle = 'rgba(185, 107, 255, 0.06)';
				for (let x = 0; x < WIDTH; x += 40) {
					ctx.fillRect(x, 0, 1, 570);
				}
				for (let y = 80; y < 570; y += 40) {
					ctx.fillRect(0, y, WIDTH, 1);
				}

				ctx.fillStyle = 'rgba(4, 2, 12, 0.55)';
				ctx.fillRect(0, 0, WIDTH, 8);
				ctx.fillRect(0, 0, 8, HEIGHT);
				ctx.fillRect(WIDTH - 8, 0, 8, HEIGHT);
			}

			function drawPlatforms() {
				const glows = ['#35d6ff', '#ffd23f', '#ff5d73', '#b96bff'];
				platforms.forEach((platform, index) => {
					if (platform.kind === 'floor') {
						ctx.fillStyle = '#120a28';
						ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
						ctx.fillStyle = '#b96bff';
						ctx.fillRect(platform.x, platform.y, platform.w, 4);
						ctx.fillStyle = 'rgba(185, 107, 255, 0.18)';
						for (let x = 8; x < WIDTH; x += 32) {
							ctx.fillRect(x, platform.y + 14, 12, 3);
						}
						return;
					}

					const dy = platform.dy || 0;
					const glow = glows[(index - 1) % glows.length];

					ctx.fillStyle = '#241746';
					ctx.beginPath();
					ctx.moveTo(platform.x, platform.y);
					ctx.lineTo(platform.x + platform.w, platform.y + dy);
					ctx.lineTo(platform.x + platform.w, platform.y + dy + platform.h);
					ctx.lineTo(platform.x, platform.y + platform.h);
					ctx.closePath();
					ctx.fill();

					ctx.strokeStyle = glow;
					ctx.lineWidth = 3;
					ctx.beginPath();
					ctx.moveTo(platform.x, platform.y);
					ctx.lineTo(platform.x + platform.w, platform.y + dy);
					ctx.stroke();

					ctx.fillStyle = glow;
					ctx.globalAlpha = 0.55;
					for (let px = 10; px < platform.w - 6; px += 26) {
						const studY = platform.y + dy * (px / platform.w) + 7;
						ctx.fillRect(platform.x + px, studY, 4, 3);
					}
					ctx.globalAlpha = 1;
				});
			}

			function drawPlayer(player, name) {
				const centerX = player.x + player.w / 2;
				const bodyY = player.y + 16;
				const it = round.it === name;

				if (it) {
					const bob = Math.sin(performance.now() / 110) * 2;
					ctx.fillStyle = '#ffd23f';
					ctx.beginPath();
					ctx.moveTo(centerX, player.y - 13 + bob);
					ctx.lineTo(centerX - 9, player.y - 25 + bob);
					ctx.lineTo(centerX - 3, player.y - 24 + bob);
					ctx.lineTo(centerX, player.y - 32 + bob);
					ctx.lineTo(centerX + 3, player.y - 24 + bob);
					ctx.lineTo(centerX + 9, player.y - 25 + bob);
					ctx.closePath();
					ctx.fill();
					ctx.strokeStyle = '#150b2e';
					ctx.lineWidth = 2;
					ctx.stroke();
				}

				ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
				ctx.beginPath();
				ctx.ellipse(centerX, player.y + player.h + 3, 16, 5, 0, 0, Math.PI * 2);
				ctx.fill();

				ctx.fillStyle = '#0e0820';
				ctx.fillRect(player.x + 4, player.y + 28, 8, 8);
				ctx.fillRect(player.x + 16, player.y + 28, 8, 8);

				ctx.fillStyle = '#0e0820';
				ctx.fillRect(player.x + 1, bodyY - 3, player.w - 2, 17);
				ctx.fillStyle = player.color;
				ctx.fillRect(player.x + 3, bodyY - 1, player.w - 6, 13);
				ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
				ctx.fillRect(player.x + 5, bodyY + 1, 3, 8);
				ctx.fillStyle = '#0e0820';
				ctx.fillRect(player.x + 3, bodyY + 10, player.w - 6, 2);

				ctx.fillStyle = '#0e0820';
				ctx.fillRect(centerX - 9, player.y + 2, 18, 12);
				ctx.fillStyle = player.color;
				ctx.fillRect(centerX - 7, player.y + 4, 14, 8);
				ctx.fillStyle = it ? '#ffd23f' : '#eafcff';
				ctx.fillRect(centerX - 5, player.y + 6, 10, 3);

				ctx.fillStyle = '#0e0820';
				ctx.fillRect(centerX - 1, player.y - 3, 2, 5);
				ctx.fillStyle = it ? '#ffd23f' : player.color;
				ctx.fillRect(centerX - 2, player.y - 5, 4, 3);

				ctx.fillStyle = '#0e0820';
				ctx.font = 'bold 9px "Courier New", monospace';
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				ctx.fillText(name === 'blue' ? 'B' : 'R', centerX, bodyY + 6);
			}

			function drawTagFlash() {
				if (tagFlash <= 0) return;
				const taggedPlayer = players[round.it];
				const x = taggedPlayer.x + taggedPlayer.w / 2;
				const y = taggedPlayer.y + taggedPlayer.h / 2;
				const radius = 22 + (0.22 - tagFlash) * 95;
				ctx.strokeStyle = `rgba(244, 200, 92, ${tagFlash / 0.22})`;
				ctx.lineWidth = 4;
				ctx.beginPath();
				ctx.arc(x, y, radius, 0, Math.PI * 2);
				ctx.stroke();
			}

			function drawFinish() {
				if (!round.finished) return;

				ctx.fillStyle = 'rgba(9, 24, 19, 0.72)';
				ctx.fillRect(0, 0, WIDTH, HEIGHT);
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				ctx.fillStyle = '#f3f0df';
				ctx.font = 'bold 32px "Courier New", monospace';
				ctx.fillText(`${round.winner.toUpperCase()} OUTLASTS`, WIDTH / 2, HEIGHT / 2 - 12);
				ctx.fillStyle = '#f4c85c';
				ctx.font = 'bold 15px "Courier New", monospace';
				ctx.fillText('NEW ROUND', WIDTH / 2, HEIGHT / 2 + 31);
			}

			function render() {
				drawBackdrop();
				drawPlatforms();
				drawPlayer(players.blue, 'blue');
				drawPlayer(players.red, 'red');
				drawTagFlash();
				drawFinish();
			}

			function frame(now) {
				const dt = Math.min((now - lastFrame) / 1000 || 0, 0.034);
				lastFrame = now;
				update(dt);
				render();
				requestAnimationFrame(frame);
			}

			document.addEventListener('keydown', (event) => {
				const key = event.key.toLowerCase();
				const jumpKey = key === 'w' || key === 'arrowup';
				const knownKey = ['w', 'a', 's', 'd', 'arrowup', 'arrowleft', 'arrowdown', 'arrowright'].includes(key);

				if (!knownKey) return;
				event.preventDefault();

				if (!keys.has(key) && jumpKey) {
					const player = key === 'w' ? players.blue : players.red;
					player.jumpQueued = true;
				}
				keys.add(key);
			});

			document.addEventListener('keyup', (event) => {
				keys.delete(event.key.toLowerCase());
			});

			window.addEventListener('blur', () => keys.clear());
			restartButton.addEventListener('click', startRound);

			startRound();
			requestAnimationFrame((now) => {
				lastFrame = now;
				requestAnimationFrame(frame);
			});
		</script>
	</body>
</html>
