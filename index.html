<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Press Start 2P", "Courier New", monospace;
      background: radial-gradient(circle at 50% 0%, #1b2740, #0b0f1a 70%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 6vw, 4rem);
      line-height: 1.25;
      color: #ffc23d;
      background: linear-gradient(180deg, #ffe066 0%, #ffb62e 45%, #e07b1c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(4px 4px 0 #2a2150) drop-shadow(0 0 2px rgba(42, 33, 80, 0.6));
      letter-spacing: 4px;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 40px;
      color: #8fa3bf;
      font-size: 0.7rem;
      line-height: 1.8;
      letter-spacing: 1px;
      text-align: center;
    }

    .games {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
    }

    .game-card {
      background: #16203a;
      border: 4px solid #2a2150;
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.35);
      border-radius: 0;
      padding: 28px 26px 32px;
      width: 320px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .game-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.35);
    }

    .game-icon {
      font-size: 2.6rem;
      margin-bottom: 16px;
      image-rendering: pixelated;
    }

    .game-card h2 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      line-height: 1.4;
      color: #ffd23f;
      text-shadow: 3px 3px 0 #2a2150;
    }

    .game-card p {
      margin: 0 0 24px;
      color: #c3d2ea;
      font-size: 0.6rem;
      line-height: 2;
      letter-spacing: 0.5px;
      flex-grow: 1;
    }

    .play-btn {
      display: inline-block;
      width: 100%;
      padding: 18px 0;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #1a1233;
      background: linear-gradient(180deg, #ffe066, #ff9d2e);
      border: 4px solid #2a2150;
      box-shadow: 4px 4px 0 #2a2150;
      border-radius: 0;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
    }

    .play-btn:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 5px 5px 0 #2a2150; }
    .play-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #2a2150; }

    .tag-card .play-btn {
      background: linear-gradient(180deg, #ff9a9a, #e0453c);
      color: #2a0f0f;
    }

    .tag-card:hover {
      box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <h1>MY ARCADE</h1>
  <p class="subtitle">Pick a game and press play!</p>

  <div class="games">
    <div class="game-card">
      <div class="game-icon">🏦</div>
      <h2>Shadow Heist</h2>
      <p>Grab coins, dodge the cops, and don't touch your own trailing shadows in this bank-robbing chase.</p>
      <a class="play-btn" href="game.html">&#9654; PLAY</a>
    </div>

    <div class="game-card tag-card">
      <div class="game-icon">🔴</div>
      <h2>Tag Battle</h2>
      <p>Two players, one arena, 120 seconds &mdash; chase your friend and tag them before time runs out.</p>
      <a class="play-btn" href="game2.html">&#9654; PLAY</a>
    </div>
  </div>
</body>
</html>
